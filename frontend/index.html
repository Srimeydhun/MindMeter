<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/images/mindmeter-navbar-logo.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6546e8" />
    <meta
      name="description"
      content="MindMeter multi-subject assessments and student analytics."
    />
    <link rel="apple-touch-icon" href="/images/mindmeter-navbar-logo.png" />
    <title>MindMeter</title>
    <script>
      try {
        const theme = localStorage.getItem('mindmeter_theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
